services:
  - type: web
    name: talentai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure value
      - key: DATABASE_URL
        sync: false                  # Set manually in Render dashboard
      - key: SUPABASE_URL
        value: https://dhfyfvodyawcqsqtrtss.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: MAX_CANDIDATES
        value: "50"
      - key: FRONTEND_URL
        sync: false                  # Set to your Vercel URL after deploy
