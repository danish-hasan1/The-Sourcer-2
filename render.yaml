services:
  - type: web
    name: talentai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_CANDIDATES
        value: "50"
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      # ⚠️  Set these manually in the Render dashboard → Environment tab
      # Do NOT add secrets here — this file is public on GitHub
      # - DATABASE_URL
      # - SUPABASE_URL
      # - SUPABASE_ANON_KEY
      # - GROQ_API_KEY
      # - SERPAPI_KEY
      # - DEFAULT_LLM_PROVIDER
